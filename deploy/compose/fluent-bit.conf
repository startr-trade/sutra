# Fluent Bit config for the local docker-compose reference stack.
#
# Job: ship the BACKING SERVICES' own container logs (postgres/rabbitmq/
# elasticsearch/kibana/otel-collector) into the `sutra-logs` index — the same
# job the k8s DaemonSet does for "infra/system container logs" in
# deploy/modules/local-k8s-infra/main.tf. The ENGINE's application logs are
# NEVER expected to arrive here: they export over OTLP straight to the
# collector (otel-collector-config.yaml, `sutra-app-logs` index) exactly as
# documented in that same main.tf and in rust/crates/sutra-engine/src/otel.rs
# — Fluent Bit tailing would double-write them, so this stack simply never
# wires the engine to Fluent Bit at all (nothing to exclude).
#
# Input mechanism: a Fluent Forward listener (port 24224), NOT a filesystem
# tail of /var/lib/docker/containers — that path only exists predictably on
# Linux hosts running the docker daemon directly (not inside the Docker
# Desktop VM on macOS/Windows), so it is not a portable choice for a reference
# stack. The forward protocol is: each OTHER service in docker-compose.yml
# sets `logging: driver: fluentd` pointed at this listener (see the compose
# file) — the docker DAEMON (a host-level process) ships that container's
# stdout/stderr here directly, no filesystem path involved anywhere. This is
# the exact `log_forward_endpoint` / port-24224 pattern
# deploy/modules/efk-stack/main.tf already exposes as an "optional forward
# listener" for the identical reason ("when you don't want to rely on
# cluster-wide stdout log shippers") — reused here, not invented fresh.
#
# Fluent Bit's OWN container deliberately does NOT opt into the fluentd log
# driver (see docker-compose.yml) — that is how the self-referential-loop the
# k8s config avoids via Exclude_Path is avoided here: there is nothing to
# exclude because Fluent Bit never logs to itself in the first place.

[SERVICE]
    Daemon        Off
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224
    # Fallback tag namespace only — every sender sets its own tag via the
    # `fluentd` docker logging driver's `tag:` option (docker-compose.yml).
    Tag_Prefix  docker.

[OUTPUT]
    Name           es
    Match          docker.*
    Host           elasticsearch
    Port           9200
    HTTP_User      elastic
    # Expanded from this container's own environment (docker-compose.yml sets
    # ES_PASSWORD) — Fluent Bit substitutes ${VAR} from the process
    # environment at config-parse time, same as the k8s Helm values do with
    # the (HCL-escaped) $${ES_PASSWORD} form.
    HTTP_Passwd    ${ES_PASSWORD}
    Index          sutra-logs
    Type           _doc
    Replace_Dots   On
    Suppress_Type_Name On
    Retry_Limit    5
