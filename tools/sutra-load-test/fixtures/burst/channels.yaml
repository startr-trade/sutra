# Channels for the burst-bench package.
#
#   burst-in   HTTP intake (external, apikey). Starts burst-emit.
#   to-fast    outbound HTTP to the sink's fast endpoint (answers at once).
#   to-slow    outbound HTTP to the sink's slow endpoint (answers after SLOW_MS).
channels:
  - name: burst-in
    transport: http
    bind: "POST /channels/burst-in"
    codec: json
    ack-mode: on-persist
    cloudevents-mode: none
    auth:
      scheme: apikey
      apikey:
        value: env:RELAY_BENCH_API_KEY
        header: X-Api-Key

  - name: to-fast
    direction: outbound
    transport: http
    bind: "${BURST_FAST_URL}"
    cloudevents-mode: none

  - name: to-slow
    direction: outbound
    transport: http
    bind: "${BURST_SLOW_URL}"
    cloudevents-mode: none
