# The relay-bench callback sink: a tiny HTTP server the `relay` load profile delivers its final
# callback to. Standalone on purpose (own Cargo.lock, not a workspace member): it is a load-test
# tool, never shipped with the engine.
[package]
name = "sutra-load-sink"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"

[profile.release]
opt-level = 3
