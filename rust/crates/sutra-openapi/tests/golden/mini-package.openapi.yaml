      description: 'Nature: sync-request-reply. Reachable process start-events: balance-query#Start.'
      x-sutra-channel: balance
      x-sutra-transport: http
      x-sutra-nature: sync-request-reply
      x-sutra-ack-mode: on-complete
      x-sutra-broadcast: false
      x-sutra-singleton: false
      x-sutra-codec: urn:sutra:codec:json
      x-sutra-reachable-processes:
      - processId: balance-query
        startEventId: Start
        payloadVar: payload
        messageTypeValue: BalanceQuery
        emits:
        - via: reply
          mode: native
          contentType: application/xml
      x-sutra-inbound-message-types:
      - BalanceQuery
      requestBody:
        required: true
        description: Decoded by the channel codec. For a data-format codec (json/xml/yaml) the body honors Content-Type negotiation; a schema-backed codec takes full control.
        content:
          application/json:
            schema:
              type: object
              x-sutra-codec: urn:sutra:codec:json
      responses:
        '200':
          description: The synchronous process reply (the caller waits for completion).
          content:
            application/json:
              schema:
                type: object
        default:
          description: A decode / validation / dispatch failure (RFC 7807 problem detail).
          content:
            application/problem+json:
              schema:
                type: object
