[package]
name = "sutra-crypto"
description = "Domain-neutral encryption-at-rest seam: PayloadCipher (AES-256-GCM) + KeyProvider (envelope DEK selected by a migration-stable keyId, derived via HKDF-SHA256). Callers compose the AAD (keyId + instance_id + variable name); this crate holds no domain concepts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = { workspace = true }
zeroize = "1"
