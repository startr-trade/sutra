[package]
name = "sutra-transport-sqs"
description = "AWS SQS vendor transport — extracted from the neutral engine (domain-neutrality refactor): the SqsTriggerSource/SqsMessageSink pair + the consumer-lifecycle manager, self-registering as a TransportFactory via inventory so sutra-engine bundles it without naming the vendor."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-channels = { path = "../sutra-channels" }
sutra-transport-spi = { path = "../sutra-transport-spi" }
sutra-persistence = { path = "../sutra-persistence" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = { workspace = true }
inventory = "0.3.24"
async-trait = { workspace = true }
time = { workspace = true }
aws-config = { workspace = true }
aws-sdk-sqs = { workspace = true }
aws-smithy-http-client = { workspace = true }
aws-credential-types = { workspace = true }

[dev-dependencies]
sutra-testkit = { path = "../sutra-testkit" }
testcontainers = { workspace = true }
