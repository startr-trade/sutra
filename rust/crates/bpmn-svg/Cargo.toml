[package]
name = "bpmn-svg"
description = "Draws BPMN 2.0 process diagrams as self-contained SVG, with a layered auto-layout for files that carry no BPMN-DI"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
readme = "README.md"
keywords = ["bpmn", "svg", "diagram", "layout", "workflow"]
categories = ["visualization", "parser-implementations"]
# Publishable to crates.io: the workspace default (publish = false) does not apply here.
publish = true

[dependencies]
quick-xml = { workspace = true }
