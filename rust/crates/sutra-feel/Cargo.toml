[package]
name = "sutra-feel"
description = "FEEL expression language engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["feel", "expression-language", "dmn", "bpmn", "rules"]
categories = ["parser-implementations", "compilers"]
# Publishable to crates.io — the workspace default (publish = false) does not apply here.
publish = true

[dependencies]
bigdecimal = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
time = { workspace = true }
time-tz = { workspace = true }
getrandom = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
# GA-readiness FEEL micro-benches (rust/bench harness). Minimal feature set —
# `cargo_bench_support` only — so no plotters/gnuplot/rayon are pulled into the graph the
# supply-chain gate (`make audit`) scans. Run with `cargo bench -p sutra-feel`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "feel_benches"
harness = false
