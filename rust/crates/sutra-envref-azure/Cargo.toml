[package]
name = "sutra-envref-azure"
description = "Azure Key Vault envref resolver — the `azure-kv:<vault-name>/<secret-name>[#<version>]` SchemeResolver, self-registering as an EnvRefResolverEntry via inventory so sutra-dist bundles it without the neutral sutra-engine naming any Azure SDK. Talks the Key Vault REST API directly over reqwest/rustls (no vendor SDK — the Azure SDK risks native-tls; the tree is rustls/ring ONLY)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-envref-spi = { path = "../sutra-envref-spi" }
inventory = "0.3.24"
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "time"] }
