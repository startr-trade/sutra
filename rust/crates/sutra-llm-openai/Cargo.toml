[package]
name = "sutra-llm-openai"
description = "The OpenAI-compatible Chat Completions provider for the `llm` transport."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-llm-spi = { path = "../sutra-llm-spi" }
inventory = "0.3.24"
serde_json = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
base64 = { workspace = true }
# The Realtime WebSocket session: the handshake only (no TLS feature — TLS is set up here with
# the same rustls + ring + native roots build the HTTPS client uses).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["net", "sync", "rt", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
