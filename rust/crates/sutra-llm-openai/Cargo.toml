[package]
name = "sutra-llm-openai"
description = "The OpenAI-compatible Chat Completions provider for the `llm` transport."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-llm-spi = { path = "../sutra-llm-spi" }
inventory = "0.3.24"
serde_json = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
