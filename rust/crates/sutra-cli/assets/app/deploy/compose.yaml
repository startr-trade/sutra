# generated-by: sutra create app (edit freely — this file is yours)
#
# Local deploy: the sutra engine image + its internal PostgreSQL + the deployments mount.
# Workflow (see ../README.md):
#   1. author under packages/<pkg>/          (standalone deployment package)
#   2. sutra package packages/<pkg>          (seals it into a .sutra archive)
#   3. drop the .sutra into ./deployments/   (the engine watches this mount)
#   4. ./smoke.sh                            (health-gated smoke + a sample channel POST)
#
# The engine's host port is DYNAMIC — never assume a fixed host port. Discover it with:
#   docker compose -f deploy/compose.yaml port engine 8080

services:
  engine:
    # The engine image — one generic image; behaviour comes entirely from the mounted
    # deployments. The default is the runtime published by the SAME distribution and release as
    # the CLI that scaffolded this file. That pairing is the whole point: codecs are linked into
    # a binary, so an engine image from a different distribution resolves a different codec set
    # and rejects channels this CLI accepted. It is also the only tag guaranteed to exist — a
    # PRE-release never moves `:latest`, so a `:latest` default cannot be pulled at all.
    #
    # Override with SUTRA_ENGINE_IMAGE (a locally built tag, or an air-gapped mirror). If this
    # image lives in a private registry, log in to it before `up` — the pull is the first thing
    # that happens and an unauthenticated one fails with `denied`/`unauthorized`.
    image: ${SUTRA_ENGINE_IMAGE:-%%ENGINE_IMAGE%%}
    environment:
      # Deployment source root: the engine loads its work from this mount. It consumes
      # packaged .sutra archives dropped into the directory; add/remove = deploy/undeploy.
      SUTRA_DEPLOYMENTS_DIR: /deployments
      # Container-internal listen port (the host side stays dynamic, see `ports`).
      SUTRA_HTTP_PORT: "8080"
      # ENGINE-INTERNAL datasource (instances / outbox / leases / audit) — never a package's
      # business store: those declare their OWN connections in the package's datastores.yaml.
      SUTRA_DATASOURCE_URL: postgres://engine-db:5432/sutra
      # NOT the postgres superuser. The engine refuses to start against a role that can bypass
      # row-level security (SUTRA.STARTUP.RLS_BYPASS_RISK) — a superuser bypasses it
      # unconditionally, which would leave the deployment-isolation policies inert. This stack
      # therefore hands the engine the same KIND of credential production does: a plain login
      # role, NOSUPERUSER and NOBYPASSRLS, created by engine-db-init.sh. The startup check stays
      # ON here, so the guarantee is enforced in development rather than acknowledged away.
      SUTRA_DATASOURCE_USERNAME: ${ENGINE_DB_USER:-sutra_engine}
      SUTRA_DATASOURCE_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
      # Resolves the `${SAMPLE_API_KEY}` reference in packages/*/channels.yaml. A real
      # deployment sources this from its secret store, never from a compose default.
      SAMPLE_API_KEY: ${SAMPLE_API_KEY:-%%APIKEY%%}
    volumes:
      - ./deployments:/deployments:ro
    ports:
      - "127.0.0.1::8080"   # dynamic host port, loopback only
    depends_on:
      engine-db:
        condition: service_healthy

  engine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sutra
      # The BOOTSTRAP superuser, used by the image's own entrypoint and by the init script
      # below — never by the engine. Splitting the two is the point: see engine-db-init.sh.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-bootstrap-dev-only}
      # Consumed by engine-db-init.sh to create the engine's own role.
      ENGINE_DB_USER: ${ENGINE_DB_USER:-sutra_engine}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
    volumes:
      # Runs ONCE, when the data volume is first initialised. `docker compose down -v` (which
      # drops the volume) is what makes it run again.
      - ./engine-db-init.sh:/docker-entrypoint-initdb.d/10-engine-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sutra"]
      interval: 2s
      timeout: 3s
      retries: 30
