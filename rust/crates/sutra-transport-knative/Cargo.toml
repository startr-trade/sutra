[package]
name = "sutra-transport-knative"
description = "The Knative Eventing vendor transport — CloudEvents over HTTP. Inbound: a `POST /knative/{subscription}` route merged onto the engine's shared listener (same `TransportChannels::inbound_router` seam as sutra-transport-http/sutra-transport-dapr, no leader election — Knative's broker push IS the delivery guarantee); outbound: a `knative://<namespace>/<broker>` destination is rewritten to a POST against the Broker ingress (or the Knative-idiomatic `K_SINK` env when set) and delegated to sutra-channels' rustls HttpSink. Self-registers a TransportFactory via inventory."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-channels = { path = "../sutra-channels" }
sutra-transport-spi = { path = "../sutra-transport-spi" }
axum = { version = "0.8", default-features = false }
inventory = "0.3.24"
async-trait = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
# Only to name the SPI's uniform spawn signature types (`Option<PgPool>`, `Handle`); knative
# uses neither a datasource nor a spawn runtime (push-based over the shared HTTP listener,
# like the HTTP transport). Same sqlx build as the rest of the tree so the `PgPool` type matches.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
# `sync` + `time`: the `ack-mode: on-complete` response-hold (oneshot settle handover +
# the bounded `on-complete.hold-timeout`) — see `knative::router`.
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# The response-hold IT drives the REAL engine actor (park → relay resume → terminal event)
# through the REAL axum router, so the test builds a ChannelEngine like the sutra-channels
# suites do: BPMN models + the token executor + `tower`'s oneshot service call.
sutra-bpmn = { path = "../sutra-bpmn" }
sutra-executor = { path = "../sutra-executor" }
# Force-linked (`use sutra_formats as _`) so the inventory-collected `raw-text` builtin the
# test channels bind is present — the composition root does the same for the real binary.
sutra-formats = { path = "../sutra-formats" }
tower = { version = "0.5", features = ["util"] }
