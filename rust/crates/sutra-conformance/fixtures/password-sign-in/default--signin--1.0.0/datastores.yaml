# `users` is a projected store: one typed column per field of schemas/user-row. Its migration seeds
# one user whose hash is the fixed test vector of the `password hash` unit tests.
datastores:
  - name: users
    type: sql
    structure:
      schema: urn:user-row
      type: UserRow
    sql:
      url-ref: env:STORE_DB_URL
      username-ref: env:STORE_DB_USER
      password-ref: env:STORE_DB_PASSWORD
      migrations: migrations/users
