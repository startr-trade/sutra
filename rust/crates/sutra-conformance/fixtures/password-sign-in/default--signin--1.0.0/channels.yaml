# Channels for the password sign-in package (HTTP intake, apikey).
#
#   enrol    {user, password}  Starts `enrol`: hashes the password and writes the users row.
#   sign-in  {user, password}  Starts `sign-in`: reads the row and answers {"signedIn": ...}.
channels:
  - name: enrol
    transport: http
    bind: "POST /channels/enrol"
    codec: json
    cloudevents-mode: none
    auth: { scheme: apikey, apikey: { value: env:SIGN_IN_API_KEY, header: X-Api-Key } }
  - name: sign-in
    transport: http
    bind: "POST /channels/sign-in"
    codec: json
    cloudevents-mode: none
    auth: { scheme: apikey, apikey: { value: env:SIGN_IN_API_KEY, header: X-Api-Key } }
