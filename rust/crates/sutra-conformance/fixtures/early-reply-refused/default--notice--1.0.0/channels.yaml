# Channels for the early-reply-refused conformance suite.
#
#   POST /channels/notice    notice-start   { id }    answers 202 with a receipt, then continues
#
# ack-mode on-persist: the caller is answered once the start is durably persisted, with the
# receipt the flow's <q:reply continue="true"> renders. Everything after that runs detached.

channels:
  - name: notice-start
    transport: http
    bind: "POST /channels/notice"
    codec: json
    ack-mode: on-persist
    cloudevents-mode: none
    auth:
      scheme: apikey
      apikey:
        value: env:NOTICE_API_KEY
        header: X-Api-Key
