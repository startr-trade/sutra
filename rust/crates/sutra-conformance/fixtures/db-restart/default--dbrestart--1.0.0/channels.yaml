# Channels for the db-restart package:
#   order-in   HTTP intake (apikey) {ref}  -> intake: logs "in|<ref>", forwards on to-worker
#   to-worker  outbound, local://worker-in -> starts worker in the same engine
#   worker-in  internal (transport: local) -> worker: counts "out|<ref>"
channels:
  - name: order-in
    transport: http
    bind: "POST /channels/order-in"
    codec: json
    ack-mode: on-persist
    cloudevents-mode: none
    auth: { scheme: apikey, apikey: { value: env:DB_RESTART_API_KEY, header: X-Api-Key } }
  - name: worker-in
    transport: local
    codec: json
    cloudevents-mode: none
  - name: to-worker
    direction: outbound
    transport: local
    bind: local://worker-in
    cloudevents-mode: none
