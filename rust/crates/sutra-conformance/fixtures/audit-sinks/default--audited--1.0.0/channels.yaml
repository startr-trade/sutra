# Channels for the audit-sinks conformance suite.
#
#   POST /channels/audited/otel           otel-start     { ref, holder }   starts the OTLP-audited process
#   POST /channels/audited/otel/status    otel-status    { ref }           answers its receive task
#   POST /channels/audited/jsonl          jsonl-start    { ref, holder }   starts the JSONL-audited process
#   POST /channels/audited/jsonl/status   jsonl-status   { ref }           answers its receive task
#
# Every status is correlated to its instance by the start event's <q:alias> on ref.

channels:
  - name: otel-start
    transport: http
    bind: "POST /channels/audited/otel"
    codec: json
    cloudevents-mode: none
    auth:
      scheme: apikey
      apikey:
        value: env:AUDITED_API_KEY
        header: X-Api-Key

  - name: otel-status
    transport: http
    bind: "POST /channels/audited/otel/status"
    codec: json
    cloudevents-mode: none
    auth:
      scheme: apikey
      apikey:
        value: env:AUDITED_API_KEY
        header: X-Api-Key

  - name: jsonl-start
    transport: http
    bind: "POST /channels/audited/jsonl"
    codec: json
    cloudevents-mode: none
    auth:
      scheme: apikey
      apikey:
        value: env:AUDITED_API_KEY
        header: X-Api-Key

  - name: jsonl-status
    transport: http
    bind: "POST /channels/audited/jsonl/status"
    codec: json
    cloudevents-mode: none
    auth:
      scheme: apikey
      apikey:
        value: env:AUDITED_API_KEY
        header: X-Api-Key
