# Channels for the wait-race package.
#
#   order-in      HTTP intake (apikey). Starts race-intake.
#   to-worker     outbound, local://worker-in -> starts race-worker in the same engine.
#   to-answer     outbound, local://answer-in -> resumes the race-intake instance at AwaitAnswer.
#   callback-out  outbound HTTP to the host recorder: the order settled.
channels:
  - name: order-in
    transport: http
    bind: "POST /channels/order-in"
    codec: json
    ack-mode: on-persist
    cloudevents-mode: none
    auth:
      scheme: apikey
      apikey:
        value: env:WAIT_RACE_API_KEY
        header: X-Api-Key

  - name: worker-in
    transport: local
    codec: json
    cloudevents-mode: none
  - name: to-worker
    direction: outbound
    transport: local
    bind: local://worker-in
    cloudevents-mode: none

  - name: answer-in
    transport: local
    codec: json
    cloudevents-mode: none
  - name: to-answer
    direction: outbound
    transport: local
    bind: local://answer-in
    cloudevents-mode: none

  - name: callback-out
    direction: outbound
    transport: http
    bind: "${WAIT_RACE_CALLBACK_URL}"
    cloudevents-mode: none
