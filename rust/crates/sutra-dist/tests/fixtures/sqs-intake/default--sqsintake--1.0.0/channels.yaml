# orders-in   a schema codec on a queue whose region, URL and endpoint are environment references
# raw-in      the same, with no codec
# quiet       a synchronous flow with no <q:reply> that runs to its end
# parked      a synchronous flow with no <q:reply> that parks
# answered    a synchronous flow that declares <q:reply>
channels:
  - name: orders-in
    transport: aws-sqs
    region: "${SQSI_REGION}"
    queue.url: "${SQSI_BASE}/sqsi-orders"
    endpoint-override: "${SQSI_ENDPOINT}"
    wait-time-seconds: "${SQSI_WAIT:1}"
    codec: urn:order
    cloudevents-mode: native
    ack-mode: on-persist
  - name: raw-in
    transport: aws-sqs
    region: "${SQSI_REGION}"
    queue.url: "${SQSI_BASE}/sqsi-raw"
    endpoint-override: "${SQSI_ENDPOINT}"
    wait-time-seconds: "1"
    cloudevents-mode: native
    ack-mode: on-persist
  - name: quiet
    transport: http
    bind: "POST /channels/quiet"
    codec: json
    cloudevents-mode: none
    auth: { scheme: apikey, apikey: { value: env:SQSI_API_KEY, header: X-Api-Key } }
  - name: parked
    transport: http
    bind: "POST /channels/parked"
    codec: json
    cloudevents-mode: none
    auth: { scheme: apikey, apikey: { value: env:SQSI_API_KEY, header: X-Api-Key } }
  - name: answered
    transport: http
    bind: "POST /channels/answered"
    codec: json
    cloudevents-mode: none
    auth: { scheme: apikey, apikey: { value: env:SQSI_API_KEY, header: X-Api-Key } }
