[package]
name = "sutra-transport-amqp"
description = "AMQP 1.0 vendor transport — extracted from the neutral engine (domain-neutrality refactor): the AmqpTriggerSource/AmqpMessageSink pair (native accepted/released/rejected dispositions, distinct from the rabbitmq AMQP 0.9.1 transport) + the consumer-lifecycle manager, self-registering as a TransportFactory via inventory so sutra-engine bundles it without naming the broker."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-envref-spi = { path = "../sutra-envref-spi" }
sutra-channels = { path = "../sutra-channels" }
sutra-transport-spi = { path = "../sutra-transport-spi" }
sutra-persistence = { path = "../sutra-persistence" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = { workspace = true }
inventory = "0.3.24"
async-trait = { workspace = true }
time = { workspace = true }
fe2o3-amqp = { workspace = true }
# Native TLS for `tls: true` / `amqp10s://`: the handshake runs here on the ring provider, and the
# secured stream is handed to fe2o3-amqp, whose own `rustls` feature stays off (see `amqp::tls`).
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
sutra-testkit = { path = "../sutra-testkit", features = ["broker-tls"] }
testcontainers = { workspace = true }
