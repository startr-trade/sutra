[package]
name = "sutra-llm-spi"
description = "The model-provider SPI behind the `llm` transport: provider-neutral request/response/failure types, the LlmProvider trait, the inventory-collected LlmProviderFactory each provider crate submits, and the shared JSON-over-HTTPS client adapters use. Names no provider."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sutra-channels = { path = "../sutra-channels" }
inventory = "0.3.24"
serde_json = { workspace = true }
tokio = { version = "1", features = ["time"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
