  # ---- Published since the 2026-09-12 triage; triaged 2026-10-12 for the 0.2.0-rc.3 cut -----
  # Re-verified against THIS release's binary, not inherited from the previous triage:
  # `readelf -d` lists libgcc_s.so.1, libm.so.6, libc.so.6 and the loader as its only
  # dependencies — no libssl3, no libstdc++6, no libgomp1 — and its 226 imported symbols
  # (0.6.17; `nm -D --undefined-only`) contain no C++ entry point and no libssl API. The only
  # OPENSSL_ names are four unresolved weak memory hooks of the statically linked AWS-LC that
  # rustls uses, which is not the base image's libssl3. The image runs as
  # USER 10001, carries no setuid/setgid binary and has no package manager.
  # RENEWAL CHECK: repeat both checks on the new binary; re-pull the base and re-scan.

  # libssl3 — present in the base, never loaded by the engine.
  # Since 0.6.21 the Kafka client carries its own OpenSSL 3.6.3, compiled into the binary
  # (rdkafka `ssl-vendored`, the openssl-src crate); everything else is rustls. That copy is
  # not the base image's libssl3: re-checked on the 0.6.21 binary, `readelf -d` still lists no
  # libssl and the binary holds no libssl name to dlopen. An image scan cannot see the vendored
  # copy; it is tracked through rust/Cargo.lock by `make audit` and `make scan-deps`.
  - id: CVE-2026-84782
    statement: "libssl3 (DTLS handshake retransmission information disclosure; rated HIGH) in the distroless base. The engine never loads libssl3: readelf -d names no OpenSSL library, the binary contains no libssl name for dlopen, and its only OPENSSL_ imports are unresolved weak hooks of the statically linked AWS-LC its rustls uses. It speaks no DTLS. Debian has since published 3.0.22-1~deb12u2, but the distroless base still ships 3.0.20 and has no package manager, so the fix arrives only when the base image is rebuilt (re-pulled 2026-11-03: neither the pinned digest nor the current cc-debian12 digest sha256:e5d81ddd… carries it)."
