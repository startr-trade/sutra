# Trivy triage record.
#
# POLICY
#   Every severity is reported. A defect has no level: the tree is either clean or it is not.
#   The one sanctioned suppression is "upstream has no fix we can reach", and it is always
#   TIME-BOXED. When `expired_at` passes the finding comes back as an alert and must be
#   re-triaged — either the fix has shipped and we take it, or the entry is renewed with a
#   fresh justification. Nothing is silenced permanently, because a permanent silence is how
#   a fix that shipped last quarter goes unnoticed for a year.
#
#   `statement` is the reason, in full. If you cannot write one, the entry does not belong here.
#
# RENEWAL
#   Last re-triaged 2026-11-03 for 0.6.17, against the 0.6.17 engine binary.
#   These expire together, on purpose: one dated re-triage of the whole file beats fifteen
#   staggered reminders. On expiry, for each entry: check whether a fixed version is now
#   reachable (`cargo update`, or a fresh base-image digest), take it if so, and only renew
#   what genuinely still has no path forward.

vulnerabilities:
