    statement: "libc6 (glibc) regexec recursion. The engine DOES import regcomp and regexec, through the bundled Kafka client (librdkafka's rdregex), which compiles a pattern only when a subscribed topic starts with ^. The flaw needs a crafted pattern with back-references; the pattern comes from the deployment's own channel configuration, never from a message, and the engine's own patterns use the Rust regex crates. Debian ships no fixed package."
