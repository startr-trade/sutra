  # ---- Published since the 2026-11-03 triage; triaged 2026-11-13 for the 0.6.21 cut ---------
  # Re-checked on the 0.6.21 binary: `readelf -d` lists libgcc_s, libm, libc and the loader only;
  # it imports regcomp/regexec (the Kafka client's rdregex), narrow sscanf, and no wide-scanf function.
  # The libssl3 entries also hold for the Kafka client's compiled-in OpenSSL 3.6.3: that copy
  # serves Kafka TLS over TCP only (handshake, record layer, SASL hashing); it runs no QUIC,
  # no CMS and no AES-GCM-SIV, and each advisory states the TLS stack does not use its path.
  # RENEWAL CHECK: re-pull the base and re-scan; check for a newer openssl-src 300.x.
  - id: CVE-2026-100290
    statement: "libc6 (glibc) regcomp/regexec double free when an allocation fails mid-compile. The engine imports regcomp and regexec only through the bundled Kafka client (librdkafka's rdregex), which compiles a pattern only when a subscribed topic starts with ^; the pattern comes from the deployment's own channel configuration, never from a message. Reaching it also needs an allocation failure at a specific point (memory exhaustion), so the worst case is a crash of an engine already out of memory. Debian ships no fixed package."
    expired_at: 2026-12-09
  - id: CVE-2026-115819
    statement: "libc6 (glibc) wide scanf (%s/%[ into a char array) writes one null byte past the destination. The engine imports no wide-scanf function (readelf --dyn-syms); its only scanf import is the narrow sscanf, which the advisory states is not affected. Debian ships no fixed package."
    expired_at: 2026-12-09
  - id: CVE-2026-107496
    statement: "libssl3 CMS_encrypt infinite loop on an EC recipient certificate with group order 1. The engine never loads libssl3 (readelf -d lists no libssl), and neither it nor the Kafka client's compiled-in OpenSSL 3.6.3 performs CMS encryption; the advisory states TLS does not use this path. Debian ships no fixed package."
    expired_at: 2026-12-09
  - id: CVE-2026-88822
    statement: "libssl3 QUIC peer-address auto-detection leaks uninitialised stack data. The engine never loads libssl3 (readelf -d lists no libssl), and the Kafka client's compiled-in OpenSSL 3.6.3 runs TLS over TCP only, never QUIC. Debian ships no fixed package."
    expired_at: 2026-12-09
  - id: CVE-2026-88823
    statement: "libssl3 AES-GCM-SIV treats an empty AAD update as a reset. The engine never loads libssl3 (readelf -d lists no libssl); no TLS cipher suite uses AES-GCM-SIV, and neither the engine nor the Kafka client's compiled-in OpenSSL 3.6.3 calls it directly. Debian ships no fixed package."
    expired_at: 2026-12-09
  - id: CVE-2026-95691
    statement: "libssl3 QUIC client use-after-free on a retransmitted CRYPTO frame. The engine never loads libssl3 (readelf -d lists no libssl), and the Kafka client's compiled-in OpenSSL 3.6.3 runs TLS over TCP only, never QUIC. Debian ships no fixed package."
    expired_at: 2026-12-09
  - id: CVE-2026-95692
    statement: "libssl3 AES-GCM-SIV out-of-bounds read on a short IV via EVP_CipherInit_ex. The engine never loads libssl3 (readelf -d lists no libssl); no TLS cipher suite uses AES-GCM-SIV, and neither the engine nor the Kafka client's compiled-in OpenSSL 3.6.3 calls it directly. Debian ships no fixed package."
    expired_at: 2026-12-09
