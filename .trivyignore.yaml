  - id: CVE-2026-8674
    statement: "glibc DNS stub resolver DoS via an overlong search domain. REACHABLE (the engine resolves hostnames through getaddrinfo), but per the advisory the trigger is the resolver's configured search list (resolv.conf), which the deployment platform controls, not a network peer. Debian defers the fix (fix_deferred); no patched package exists."
