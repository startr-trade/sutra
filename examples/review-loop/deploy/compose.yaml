# Run the review-loop example locally: engine + PostgreSQL. Nothing needs a real key.
#
#   docker compose -f examples/review-loop/deploy/compose.yaml up -d
#   sutra package examples/review-loop/deployments-src/default--review--1.0.0 \
#        --out examples/review-loop/deploy/deployments
#
# The engine watches ./deployments and activates the archive without a restart. The project name
# is explicit so this stack can never collide with another one that would default to `deploy`.

name: sutra-review-loop

services:
  engine:
    # 0.6.0 or later. Override with SUTRA_ENGINE_IMAGE to run a locally built tag.
    image: ${SUTRA_ENGINE_IMAGE:-ghcr.io/startr-trade/sutra:0.6.2}
    environment:
      SUTRA_DEPLOYMENTS_DIR: /deployments
      SUTRA_HTTP_PORT: "8080"
      SUTRA_DATASOURCE_URL: postgres://engine-db:5432/sutra
      # A plain login role, not the postgres superuser — see engine-db-init.sh.
      SUTRA_DATASOURCE_USERNAME: ${ENGINE_DB_USER:-sutra_engine}
      SUTRA_DATASOURCE_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}

      # The SQL audit sink: GET /admin/instances/{id}/history reads it.
      SUTRA_AUDIT_SQL: "true"
      # DEV ONLY: /admin/* without authentication. Never in anything real.
      SUTRA_ADMIN_OIDC_DEV_DISABLED: "true"

      # --- what the package names --------------------------------------------------------------
      REVIEW_API_KEY: ${REVIEW_API_KEY:-dev-only-review-key}
    volumes:
      - ./deployments:/deployments:ro
    ports:
      # Dynamic host port, loopback only: `docker compose -f … port engine 8080` shows it.
      - "127.0.0.1::8080"
    depends_on:
      engine-db:
        condition: service_healthy

  engine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sutra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-bootstrap-dev-only}
      ENGINE_DB_USER: ${ENGINE_DB_USER:-sutra_engine}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
    volumes:
      - ./engine-db-init.sh:/docker-entrypoint-initdb.d/10-engine-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sutra"]
      interval: 2s
      timeout: 3s
      retries: 30
