# Deployment package labels — one standalone authoring unit once composed with ../../shared:
#   sutra package <this dir> --overlay examples/ai-advanced/shared
# seals one content-addressed .sutra archive. An overlay layer may not carry package.yaml, so
# both variants hold their own copy; the labels are the same (the variants are alternative builds
# of one module, deploy one at a time). Labels are opaque selectors: tenant is a label, not a
# resource scope.
labels:
  "module": "ai-advanced"
  "tenant": "default"
  "version": "1.0.0"
engine:
  minContract: 1
