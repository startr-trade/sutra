# Run the ai-summarize example locally: engine + PostgreSQL + a stub model server. Nothing to edit.
#
#   sutra package examples/ai-summarize/variants/stub-openai --overlay examples/ai-summarize/shared \
#        --out examples/ai-summarize/deploy/deployments
#   docker compose -f examples/ai-summarize/deploy/compose.yaml up -d
#
# Package ONE variant into ./deployments at a time: they all bind the same /channels/... paths.
#
# The engine watches ./deployments and activates the archive without a restart. The project name
# is explicit so this stack can never collide with another one that would default to `deploy`.

name: sutra-ai-summarize

services:
  engine:
    image: ${SUTRA_ENGINE_IMAGE:-ghcr.io/startr-trade/sutra:0.6.10}
    environment:
      SUTRA_DEPLOYMENTS_DIR: /deployments
      SUTRA_HTTP_PORT: "8080"
      SUTRA_DATASOURCE_URL: postgres://engine-db:5432/sutra
      # A plain login role, not the postgres superuser — see engine-db-init.sh.
      SUTRA_DATASOURCE_USERNAME: ${ENGINE_DB_USER:-sutra_engine}
      SUTRA_DATASOURCE_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}

      # What channels.yaml names by reference. Resolved by the ENGINE, in ITS environment.
      SUMMARIZE_API_KEY: ${SUMMARIZE_API_KEY:-dev-only-summarize-key}
      # The stub variants' key: any non-empty value satisfies the stub.
      LLM_API_KEY: ${LLM_API_KEY:-stub-not-a-real-key}
      # The real-provider variants' keys. An `env:` reference to an unset variable fails the
      # channel at load, so each is always defined: export the real one before `up`; the
      # placeholder only ever reaches the provider as a key it rejects.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-set}
    volumes:
      # DEPLOYMENTS_DIR overrides the archive directory (live-check.sh uses a temporary one).
      - ${DEPLOYMENTS_DIR:-./deployments}:/deployments:ro
    ports:
      # Loopback only. Dynamic by default (`docker compose -f … port engine 8080` shows it); set
      # ENGINE_HOST_PORT for a fixed one.
      - "127.0.0.1:${ENGINE_HOST_PORT:-}:8080"
    depends_on:
      engine-db:
        condition: service_healthy
      model-stub:
        condition: service_started

  # Speaks the OpenAI and Anthropic wire formats with fixed answers; /sink records what the async
  # flow sends. Resolvable from the engine as http://model-stub:8000 (the base-url in the stub
  # variants' channels.yaml). The real-provider variants still use its /sink.
  model-stub:
    image: python:3.12-alpine
    command: ["python3", "/stub/model-stub.py", "8000"]
    volumes:
      - ../stub:/stub:ro

  engine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sutra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-bootstrap-dev-only}
      ENGINE_DB_USER: ${ENGINE_DB_USER:-sutra_engine}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:-sutra-dev-only}
    volumes:
      - ./engine-db-init.sh:/docker-entrypoint-initdb.d/10-engine-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sutra"]
      interval: 2s
      timeout: 3s
      retries: 30
