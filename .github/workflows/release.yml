name: Release

# Fires on a semver tag (`v*`). `main` never publishes anything.
#
# Ships EXACTLY two runtime artifact families — nothing else in the workspace is a
# user-facing deliverable:
#
#   1. the engine container image  — ghcr.io/startr-trade/sutra   (built from the
#      `sutra-dist` binary crate via rust/Dockerfile; multi-arch amd64 + arm64,
#      cosign-signed, SPDX SBOM attested + attached)
#   2. the `sutra` CLI binaries    — sutra-cli, static musl for linux x86_64/aarch64 and
#      an MSVC build for Windows x86_64, tar.gz/zip + SHA256SUMS as Release assets
#
# Plus one library publish: sutra-feel then sutra-dmn to crates.io (guarded on the token
# secret being configured). Every other crate in the workspace is engine-internal or
# development tooling and is never built, uploaded, or referenced here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IMAGE_NAME: ghcr.io/startr-trade/sutra

jobs:
  # ---------------------------------------------------------------------------
  # Gate. crates.io publishing is irreversible, so it waits on this.
  # ---------------------------------------------------------------------------
  test:
    name: verify (make lint + make test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Restores ci.yml's main-branch cache (same `shared-key`), so this gate re-verifies the
      # tagged tree without recompiling the dependency graph from zero. Cargo's own
      # fingerprinting decides what is still valid — the gate itself is unchanged, it still
      # runs the whole of `make lint` and `make test`.
      #
      # `save-if: false` because this job runs on a TAG ref: a cache saved here is readable
      # only by that same tag, so writing one would spend upload time on something the next
      # release can never hit, while evicting main's caches from the 10 GB budget.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: verify
          save-if: false
      - run: make lint
      - run: make test

  # ---------------------------------------------------------------------------
  # 1. Engine image — multi-arch, signed, SBOM'd.
  # ---------------------------------------------------------------------------
  image-build:
    name: engine image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
            # Starts WARM. trivy.yml builds this exact Dockerfile, this exact context, at
            # this exact default profile on every push to main — and a cache written on the
            # DEFAULT BRANCH is readable from a tag ref (one written on a tag ref is not).
            # So the chef-cook dependency layer, ~500 crates and the bulk of this build,
            # is imported rather than recompiled.
            cache_from: type=gha,scope=trivy-image
          # GitHub's hosted arm64 Linux runner — free on public repos, and a NATIVE arm
          # compile rather than an emulated one.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
            # Cold, and deliberately: nothing on main builds arm64, so there is no cache to
            # import. Warming it would mean a daily arm64 build existing only to serve this
            # rare job — more compute spent than saved. Native arm is what makes that trade
            # fine; the cold build costs roughly what the amd64 leg costs.
            cache_from: ""
    runs-on: ${{ matrix.runner }}
    # Native compiles, so the arm64 leg costs roughly what the amd64 leg does. The old
    # six-hour ceiling existed only to survive emulation.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless (Sigstore OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # NO QEMU. Each architecture is built on a runner of that architecture (see the
      # `platform` matrix): arm64 on GitHub's hosted `ubuntu-24.04-arm`, which is free for
      # public repositories. Emulating an arm64 Rust build under binfmt recompiled the whole
      # dependency graph plus librdkafka's vendored C at emulated speed — the reason this job
      # once budgeted six hours. Native runners cut it to the amd64 leg's own time, and the
      # two legs run in parallel.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build ONE platform and push BY DIGEST — no tag. Tagging happens once, in the merge
      # job below, because a tag can only point at one thing: if each leg pushed the same tag
      # the second would silently overwrite the first and the "multi-arch" image would be
      # whichever leg finished last.
      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./rust
          file: ./rust/Dockerfile
          platforms: ${{ matrix.platform }}
          # org.opencontainers.image.source is what makes ghcr.io LINK this package to the
          # repository — which is how the package shows up on the repo page and how a reader
          # gets from the image back to the code. Without it the package is an orphan in the
          # org's package list, and its visibility has to be managed entirely by hand.
          #
          # It does NOT make the package public: on ghcr.io a package's visibility is its own
          # setting, independent of the repository's, and a package first pushed by a workflow
          # starts PRIVATE. That is a one-time flip in the package settings — and until it is
          # flipped, `docker pull` answers `unauthorized`, never `not found`, because ghcr.io
          # does not distinguish "private" from "does not exist" to an anonymous caller.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          provenance: true
          # SBOM is produced by anchore/sbom-action on the MERGED manifest and cosign-attested
          # there, so buildkit's own SBOM attestation stays off — two competing SBOM
          # predicates on one image is worse than one.
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # READ ONLY, and only from a scope some main-branch workflow actually writes (see
          # the matrix). There is deliberately no `cache-to`: this job runs on a TAG ref, and
          # a tag-ref cache is readable only by that same ref — the next release, a different
          # tag, could never hit it. Exporting mode=max here would spend minutes per leg
          # writing something nothing can ever read, and would push main's CI caches out of
          # the repository's 10 GB cache budget while doing it.
          cache-from: ${{ matrix.cache_from }}

      # The digest is how the merge job finds this leg. One file per platform, named by the
      # digest itself, so the two matrix jobs cannot collide in the shared artifact.
      - name: Export the digest
        run: |
          set -eu
          digest='${{ steps.build.outputs.digest }}'
          mkdir -p /tmp/digests
          # Bare hex, no `sha256:` prefix — a colon is an illegal character in an artifact
          # path, and the merge step prefixes it back on.
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Fuse the per-architecture images into ONE manifest list, then sign and SBOM
  # THAT — the digest a user's `docker pull ghcr.io/startr-trade/sutra:<tag>`
  # actually resolves to.
  # ---------------------------------------------------------------------------
  image:
    name: engine image (manifest list)
    needs: image-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (Sigstore OIDC)
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      version: ${{ steps.rel.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolved explicitly rather than with metadata-action's `type=semver`, which reads
      # github.ref: on a workflow_dispatch re-release the ref is a BRANCH, so type=semver
      # would emit no tags at all and the push would be a silent no-op.
      - name: Resolve release tag
        id: rel
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::expected a v-prefixed semver tag, got '$tag'"; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # A tag containing '-' is a pre-release (v1.0.0-rc.1) and must NOT move `latest`.
          case "$tag" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "latest=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create the manifest list
        id: merge
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          LATEST: ${{ steps.rel.outputs.latest }}
        run: |
          set -eu
          tags="--tag ${IMAGE_NAME}:${VERSION}"
          # An `&&` one-liner here would be a landmine: under `set -e` a false test makes the
          # whole command return 1 and kills the step. A pre-release would fail the release
          # precisely BECAUSE it correctly declined to move `latest`.
          if [ "$LATEST" = "true" ]; then
            tags="$tags --tag ${IMAGE_NAME}:latest"
          fi
          # Each digest file is named for the manifest one architecture leg pushed; together
          # they are the sources of the list. Word-splitting is the point here.
          # shellcheck disable=SC2046
          docker buildx imagetools create $tags \
            $(printf "${IMAGE_NAME}@sha256:%s " $(ls /tmp/digests))
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "manifest ${IMAGE_NAME}:${VERSION} -> ${digest}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      # Keyless (Sigstore / Fulcio): the signing identity IS this workflow's OIDC identity —
      # no long-lived key material anywhere. Signs the MANIFEST LIST digest, which is what
      # `cosign verify ghcr.io/startr-trade/sutra:<tag>` resolves to.
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM to the image digest
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE_NAME}@${DIGEST}"

      # Handed to the `release` job, which attaches it to the GitHub Release alongside the
      # CLI archives (so consumers get the SBOM without needing cosign).
      - name: Upload SBOM for the Release job
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Job summary
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          {
            echo "### Engine image"
            echo ""
            echo "- \`${IMAGE_NAME}:${VERSION}\`"
            echo "- digest \`${DIGEST}\`"
            echo "- platforms: linux/amd64 + linux/arm64, each built natively (no emulation)"
          } >> "$GITHUB_STEP_SUMMARY"


  cli:
    name: sutra CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Every target in this matrix is a required deliverable — a broken target fails the
    # release rather than silently shipping a partial asset set.
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl. The sutra-cli dependency tree's only native-code dependency is
          # `ring` (the rustls crypto provider) — sqlx/postgres, reqwest, kube and
          # k8s-openapi are all pure Rust with rustls, and `openssl-probe` only reads cert
          # paths (no libssl linkage). ring needs a C toolchain for the target, which
          # `musl-tools` supplies for the host arch.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            archive: tar.gz
          # ...but musl-tools does NOT cross-compile to aarch64, and ring's build script
          # needs a real aarch64-musl C compiler. `cross` supplies exactly that in a
          # container image (a true cross-compile — not emulation, so it runs at native
          # x86 speed).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          # Windows: the MSVC dependency tree adds only schannel + windows-sys (pure-Rust
          # bindings to system libraries, no C build), and the CLI's few unix-only bits are
          # `#[cfg(unix)]`-gated. No native-dep blocker on this target.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The workspace pins its toolchain (rust/rust-toolchain.toml) and cargo obeys the
      # pin, so the cross-target must be added to THAT toolchain — the action above only
      # equips `stable`. Running inside rust/ makes rustup resolve (and auto-install)
      # the pinned channel before adding the target.
      - name: Add the target to the pinned toolchain
        if: ${{ !matrix.use_cross }}
        working-directory: rust
        run: rustup target add ${{ matrix.target }}

      # Restore-only, for the reason above. Nothing on main compiles these targets (CI builds
      # the host gnu target), so there is nothing to hit either — and warming them would mean
      # compiling three release targets on every main push to save a rare release job, which
      # is more compiling, not less.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: cli-${{ matrix.target }}
          save-if: false

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # `-p sutra-cli` builds the single `sutra` binary. The release profile already sets
      # `strip = true` (rust/Cargo.toml), so the emitted binary is stripped — no separate
      # strip step (and no per-target binutils) is needed.
      - name: Build (cross)
        if: matrix.use_cross
        working-directory: rust
        run: cross build --release --locked -p sutra-cli --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        working-directory: rust
        run: cargo build --release --locked -p sutra-cli --target ${{ matrix.target }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          stage="sutra-${TAG}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp "rust/target/${TARGET}/release/sutra" "dist/${stage}/"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/${stage}/"
          tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
          rm -rf "dist/${stage}"
          ls -l dist

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "sutra-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "rust/target/$env:TARGET/release/sutra.exe" "dist/$stage/"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "dist/$stage/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"
          Remove-Item -Recurse -Force "dist/$stage"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. GitHub Release — CLI archives + SHA256SUMS + the image SBOM.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release assets
    needs: [cli, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release / upload assets
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist

      # Bare filenames (no ./ prefix, no directories) so a consumer can
      # `sha256sum --ignore-missing -c SHA256SUMS` from the directory it downloaded into —
      # which is exactly what scripts/install.sh does.
      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          set -eu
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Create / update the Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          # A tag containing '-' is a pre-release (v1.0.0-rc.1).
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # Authored notes win: .github/releases/<tag>.md, if present, is the release
          # body; otherwise fall back to GitHub's commit-generated notes.
          notes="--generate-notes"
          if [ -f ".github/releases/$TAG.md" ]; then
            notes="--notes-file .github/releases/$TAG.md"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              $notes \
              --verify-tag \
              $prerelease
          fi
          gh release upload "$TAG" dist/* --clobber

  # ---------------------------------------------------------------------------
  # 4. crates.io — the two library crates, in dependency order.
  # ---------------------------------------------------------------------------
  #
  # PREREQUISITES (checked once, before the first real tag — cargo will refuse otherwise):
  #   * rust/crates/sutra-feel/Cargo.toml and rust/crates/sutra-dmn/Cargo.toml must set
  #     `publish = true` in their own [package] table. Both currently inherit
  #     `publish.workspace = true`, and [workspace.package] sets `publish = false`.
  #   * sutra-dmn's dependency on sutra-feel must carry a version, not just a path:
  #     `sutra-feel = { path = "../sutra-feel", version = "..." }` — cargo rejects
  #     version-less path dependencies at publish time.
  #   * `CRATES_IO_TOKEN` must exist as a repository secret. Without it this job runs and
  #     reports a skip; it never fails the release.
  crates-publish:
    name: crates.io (sutra-feel → sutra-dmn)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The `secrets` context is not available in a step-level `if:`, so the token is
      # surfaced through `env` and the guard tests `env.CRATES_IO_TOKEN != ''` — the
      # same "skip unless configured" semantics, expressed in a context that `if:` can read.
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Skip notice
        if: ${{ env.CRATES_IO_TOKEN == '' }}
        run: echo "::notice::CRATES_IO_TOKEN is not configured — skipping the crates.io publish."

      # Dependency order matters: sutra-dmn depends on sutra-feel. Modern cargo blocks on
      # index propagation after the first publish, so no manual sleep is needed.
      #
      # IDEMPOTENT, and it has to be. A crates.io version is immutable — it can never be
      # published twice — while this job can absolutely run twice: a re-release of the same
      # tag through workflow_dispatch, or a release retried after a later job failed. So an
      # already-published version is a SUCCESS here, not a failure. Only that one error is
      # tolerated; every other publish failure still fails the job.
      #
      # The token goes through CARGO_REGISTRY_TOKEN rather than `--token`, which cargo now
      # warns is deprecated.
      - name: Publish sutra-feel, then sutra-dmn
        if: ${{ env.CRATES_IO_TOKEN != '' }}
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -eu
          for crate in sutra-feel sutra-dmn; do
            echo "::group::cargo publish -p ${crate}"
            if out="$(cargo publish --locked -p "$crate" 2>&1)"; then
              echo "$out"
              echo "::notice::${crate} published."
            else
              echo "$out"
              case "$out" in
                *"already exists on crates.io"*)
                  echo "::notice::${crate} is already published at this version — nothing to do." ;;
                *)
                  echo "::error::${crate} failed to publish."; exit 1 ;;
              esac
            fi
            echo "::endgroup::"
          done
