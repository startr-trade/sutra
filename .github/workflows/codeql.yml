name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

jobs:
  analyze:
    name: Analyze (Rust)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Shared with `make codeql`, so the local gate and this run analyze the same code.
          config-file: ./scripts/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

# NOTES
# - CodeQL code scanning is FREE on public repositories (GitHub Advanced Security
#   is included); on a private repo it needs a GHAS licence, so this effectively
#   activates once the repo is public.
# - CodeQL's Rust support is recent. `build-mode: none` extracts from source, which
#   suits the workspace living under rust/. If it ever misses code, switch to
#   build-mode `manual` with an explicit `cargo build` step (working-directory: rust).
# - Alternatively, enable CodeQL "default setup" from the repo Security tab and delete
#   this file.
