name: Trivy

# The WEEKLY watch: what changed outside the code. A vulnerability disclosed after a release is not
# caught by the commit that shipped it, so once a week this scans the tree (a lockfile that was clean
# on Monday is not clean on Friday) and the image users actually pull, the newest published release,
# both architectures. It builds nothing.
#
# The per-commit filesystem scan is a job in ci.yml (`make scan-deps` locally), and the image a
# release ships is scanned by release.yml before its tag exists (`make scan-image` locally). Until
# 2026-11 this workflow also built a release-profile engine image on every push to main, beside CI,
# only to scan it: a full compile per commit that no release reused.

on:
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to scan (e.g. 0.6.24); blank = the newest published release"
        required: false

permissions:
  contents: read

jobs:
  fs:
    name: filesystem (deps · secrets · IaC)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          # EVERY severity is reported. A defect has no level: either the tree is clean or
          # it is not. The only sanctioned suppression is "no fix available", recorded with
          # its justification (and an expiry date) in .trivyignore.yaml.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          # Passed EXPLICITLY: the action only adds --ignorefile when this input is set.
          # Without it the triage record in .trivyignore.yaml is silently not applied here,
          # even though a local `trivy fs` picks it up from the working directory.
          trivyignores: .trivyignore.yaml
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # The published engine image, pulled from ghcr.io by Trivy itself (the package is public), one
  # leg per architecture: each is its own set of OS packages and its own binary.
  image:
    name: published engine image (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Resolve the image to scan
        id: img
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event.inputs.version }}
        run: |
          set -eu
          version="${WANTED:-}"
          if [ -z "$version" ]; then
            # The newest published release, pre-releases included: that is what was shipped last.
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
            [ -n "$tag" ] || { echo "::error::no published release to scan"; exit 1; }
            version="${tag#v}"
          fi
          echo "ref=ghcr.io/startr-trade/sutra:${version}" >> "$GITHUB_OUTPUT"
          echo "scanning ghcr.io/startr-trade/sutra:${version} (${{ matrix.platform }})"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          scan-type: image
          image-ref: ${{ steps.img.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

# These jobs REPORT to the Security tab (SARIF) rather than fail: they watch what is already
# published. The gates are ci.yml's filesystem scan (every commit) and release.yml's image scan
# (before a tag exists), both failing on any finding the triage record does not cover.
#
# SEVERITY POLICY. Both scans report EVERY severity — a defect has no level, so the tree is
# either clean or it is not. The one sanctioned suppression is "upstream has no fix", and
# every such entry lives in .trivyignore.yaml with the reason written next to it AND an
# expiry date. When an entry expires the finding returns as an alert and must be re-triaged:
# a suppression that never comes back is how a fix that shipped last quarter goes unnoticed
# for a year.
#
# `trivyignores` is passed explicitly because the action only adds --ignorefile when that
# input is set: relying on Trivy's working-directory lookup works locally and silently does
# not in CI, which is how a triage record can appear to be applied while it is not.
#
# Reproduce a run locally with:
#   make scan-deps
#   trivy image --platform linux/amd64 ghcr.io/startr-trade/sutra:<version>
