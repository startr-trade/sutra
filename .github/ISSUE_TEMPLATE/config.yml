# Keep the two templates above as the only issue forms, and point everything else
# somewhere better than a blank issue.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/startr-trade/sutra/discussions
    about: Usage questions, design discussion, and "is this a bug?" — start here.
  - name: Security vulnerability
    url: https://github.com/startr-trade/sutra/security/policy
    about: Do NOT open a public issue. Report privately — see SECURITY.md.
